[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "navidrome-music-adder"
version = "0.1.0"
description = "Import TIDAL playlist snapshots through Tidarr into per-user Navidrome playlists"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "authlib>=1.6,<2",
  "cryptography>=45,<47",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "nicegui>=3.16,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "tenacity>=9,<10",
  "tidalapi>=0.8.11,<0.9",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[project.scripts]
navidrome-music-adder = "navidrome_music_adder.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"src/navidrome_music_adder/app.py" = ["E501"]
